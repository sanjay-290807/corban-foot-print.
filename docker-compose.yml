version: '3.8'

services:
  carboniq:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./static/reports:/app/static/reports
    environment:
      - FLASK_ENV=production
    depends_on:
      - ollama
    networks:
      - carboniq-network

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - carboniq-network
    command: serve

volumes:
  ollama-data:

networks:
  carboniq-network:
    driver: bridge